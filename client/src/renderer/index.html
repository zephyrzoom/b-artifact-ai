<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      渲染层不访问网络（一切走 IPC），所以 CSP 直接锁死：
      - connect-src 只留 Vite dev server 的 websocket（HMR），生产环境等于什么都不通；
      - 不允许 eval / 外部脚本 / object / frame，base-uri 也禁掉。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:5273; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>b-artifact</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
