name: Build & Package

# 跨平台打包：每个 OS 用各自的 runner 原生构建（Rust+rusqlite 与 Electron 都不适合交叉编译）。
#   - 后端：Rust 原生二进制 + 管理端静态站（admin/dist）→ tar.gz / zip
#   - 前端：Electron 客户端 → linux AppImage+tar.gz / win portable 单文件 / mac zip
#
# **runner 标签与产物架构必须显式配对**。macos-latest 已于 2026-06 从 macOS 15 迁到 macOS 26，
# 底层机器同时从 Intel 换成 Apple Silicon——"macOS ⇒ x64"这个 macos-13 时代的隐含假设已经不成立。
# 所以架构由矩阵的 `arch` 字段显式传给 electron-builder，而不是靠 runner 标签隐式推导：
# 平台哪天再迁一次，产物架构不会跟着静默错位。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target_os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            arch: x64
            electron_flag: --linux
            ext: ""
          - os: windows-latest
            target_os: windows
            arch: x64
            electron_flag: --win
            ext: ".exe"
          # macos-latest = macOS 26，**Apple Silicon（arm64）**。
          # 原先这里是 macos-13（Intel x64），而该镜像已于 2025-12-04 完全退役、标签已不存在，
          # 这条腿实际上已经起不来 runner。现按最新系统重建，产物随之改为 arm64
          # （与 client/electron-builder.yml 的 mac 段一致）。
          - os: macos-latest
            target_os: macos
            arch: arm64
            electron_flag: --mac
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 客户端依赖树最大，用它的 lock 做 npm 缓存键
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # ---------- 管理端（Vue 静态站点，服务端在 /admin/ 下托管）----------
      - name: Build admin (Vue)
        working-directory: admin
        run: |
          npm ci
          npm run build

      # ---------- 服务端（Rust 原生二进制）----------
      - name: Build server (Rust)
        working-directory: server
        run: cargo build --release

      # ---------- 客户端（Electron）----------
      # **每条 npm 命令各占一个 step，不要串在同一个 run: 里。**
      # 踩过的坑：Windows 腿的 run: 里串了 `npm ci` / `npm run build` / `npm run icon`，
      # 其中 `npm run build` 因build.mjs 用了 POSIX-only 的 `.bin/vite` 而失败，但 pwsh 的
      # `$ErrorActionPreference='Stop'` 默认不拦原生命令的非零退出，GitHub 也只在脚本**末尾**
      # 查一次 `$LASTEXITCODE`——于是紧接着的 `npm run icon`（纯 node，正常）把退出码盖成 0，
      # 步骤绿灯通过，electron-builder 顺手把「只有 main+preload、没有 renderer」的半成品
      # 打进 exe，直到用户双击才看到「渲染层尚未构建」。拆开之后每步各自查退出码。
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build client (main + preload + renderer)
        working-directory: client
        run: npm run build

      - name: Generate client icon
        working-directory: client
        run: npm run icon

      - name: Package client (${{ matrix.target_os }}-${{ matrix.arch }})
        working-directory: client
        run: npx electron-builder ${{ matrix.electron_flag }} --${{ matrix.arch }} --publish never

      # 打包门禁：asar 里**必须**含渲染层入口。
      # 为什么要这道：打包器只按 `files` 收集，不校验应用能不能起得来。缺 index.html 的包
      # 能顺利通过构建、打包、上传，直到用户双击exe 才暴露（真实踩过）。三平台都跑——
      # 这正是上一条缺陷能一路绿灯的原因：只有 Windows 腿出问题，却没有任何跨平台断言。
      - name: Verify asar contains renderer entry
        run: node scripts/check_asar.mjs

      # ---------- 组装后端交付物：二进制 + admin/dist + 样例配置 ----------
      - name: Assemble backend bundle
        shell: bash
        run: |
          set -euo pipefail
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          BIN="b-artifact-server${{ matrix.ext }}"
          SRC="server/target/release/$BIN"
          # 目录名带上架构：Rust 二进制是**跟着 runner 架构原生编译**的（mac 腿现为 arm64），
          # 名字里不标架构的话，将来再加一条 x64 腿就会互相覆盖，用户也无从判断能不能跑。
          DEST="upload/b-artifact-server-$OS-$ARCH"
          mkdir -p "$DEST/admin"
          cp "$SRC" "$DEST/"
          cp -r admin/dist "$DEST/admin/dist"
          cat > "$DEST/b-artifact.toml.example" <<'TOML'
          [server]
          listen = "0.0.0.0:9000"
          # 管理端静态站；默认即本目录下的 admin/dist，http://<host>:9000/admin/
          admin_dir = "admin/dist"

          [storage]
          compression = "zstd"
          max_file_size_mb = 2048

          [auth]
          session_ttl_days = 7
          # 首个成功登录的用户自动成为系统管理员（本地 / LDAP 通用）
          first_user_admin = true

          # [auth.ldap]
          # enabled = true
          # url = "ldaps://ldap.example.com"
          # user_base = "ou=people,dc=example,dc=com"
          # user_filter = "(sAMAccountName={username})"
          TOML
          cat > "$DEST/README.txt" <<TXT
          b-artifact 服务端（backend）— ${{ matrix.target_os }} / ${{ matrix.arch }}

          启动：
            ./b-artifact-server --data-dir ./data --listen 0.0.0.0:9000
          首次创建管理员（交互式输入密码）：
            ./b-artifact-server --create-admin admin
          管理端默认从本目录下的 admin/dist 提供（http://<host>:9000/admin/）。
          把 b-artifact.toml.example 复制为 b-artifact.toml 可自定义监听地址 / LDAP。
          TXT
          echo "后端交付物已就绪：$DEST"

      - name: Stage client artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload/client
          # 只搬 release 顶层的分发文件本身；不要 electron-builder 顺手生成的
          # *.blockmap（差量更新索引）、builder-debug.yml 和 *-unpacked/ 解包目录（-type f 只取文件）。
          # Windows(portable) 搬完恰好就是一个 exe；linux 为 AppImage+tar.gz；mac 为 zip。
          find client/release -maxdepth 1 -type f \
            ! -name '*.blockmap' \
            ! -name 'builder-debug.yml' \
            ! -name 'builder-effective-config.yaml' \
            -exec cp {} upload/client/ \;
          echo "=== upload/ 内容 ==="
          ls -R upload

      # ---------- 后端打包成归档 ----------
      - name: Archive backend (unix)
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          tar -czf "upload/b-artifact-server-$OS-$ARCH.tar.gz" -C "upload/b-artifact-server-$OS-$ARCH" .
          rm -rf "upload/b-artifact-server-$OS-$ARCH"

      - name: Archive backend (windows)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $OS = "${{ matrix.target_os }}"
          $ARCH = "${{ matrix.arch }}"
          Compress-Archive -Path "upload/b-artifact-server-$OS-$ARCH/*" -DestinationPath "upload/b-artifact-server-$OS-$ARCH.zip" -Force
          Remove-Item -Recurse -Force "upload/b-artifact-server-$OS-$ARCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target_os }}
          path: upload
          if-no-files-found: warn

  # 仅打 tag（v*）时把三个平台的产物汇总成一个 GitHub Release
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: dist-*
          merge-multiple: false

      - name: Flatten to release assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          echo "=== 待发布文件 ==="
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
