name: Build & Package

# 跨平台打包：每个 OS 用各自的 runner 原生构建（Rust+rusqlite 与 Tauri 都不适合交叉编译）。
#   - 后端：Rust 原生二进制 + 管理端静态站（admin/dist）→ tar.gz / zip
#   - 前端：Tauri 客户端（v0.5.0 起替换 Electron）→ linux tar.gz / win 单 exe / mac zip
#
# **runner 标签与产物架构必须显式配对**。macos-latest 已于 2026-06 从 macOS 15 迁到 macOS 26，
# 底层机器同时从 Intel 换成 Apple Silicon——"macOS ⇒ x64"这个 macos-13 时代的隐含假设已经不成立。
# 所以架构由矩阵的 `arch` 字段 + `tauri_target` 显式给出，而不是靠 runner 标签隐式推导：
# 平台哪天再迁一次，产物架构不会跟着静默错位。
on:
  push:
    # `tauri` 是 v0.5.0 的迁移分支：不放开它，推上去**一个 run 都不会有**
    # （2026-10-29 就是这样踩了一次——分支过滤比任何构建错误都更安静）。
    # 合并进 main 之后把 tauri 从列表里删掉。
    branches: [main, tauri]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 手动触发：Actions 页 → Build & Package → Run workflow（选分支即可）
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target_os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            arch: x64
            tauri_target: x86_64-unknown-linux-gnu
            # `bundle.targets` 里只剩 `app`（macOS 专属）。linux/win 本来只分发裸二进制，
            # 传 --no-bundle 既快又不会撞 "target `app` not supported on this platform"。
            bundle_flag: --no-bundle
            ext: ""
          - os: windows-latest
            target_os: windows
            arch: x64
            tauri_target: x86_64-pc-windows-msvc
            bundle_flag: --no-bundle
            ext: ".exe"
          # macos-latest = macOS 26，**Apple Silicon（arm64）**。
          # 原先这里是 macos-13（Intel x64），而该镜像已于 2025-12-04 完全退役、标签已不存在，
          # 这条腿实际上已经起不来 runner。现按最新系统重建，产物随之改为 arm64
          # （产物架构与 client/src-tauri/tauri.conf.json 的 bundle 段一致）。
          - os: macos-latest
            target_os: macos
            arch: arm64
            tauri_target: aarch64-apple-darwin
            # macOS 要 .app 包（目标在 tauri.conf.json 里固定为 app）
            bundle_flag: ""
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 客户端依赖树最大，用它的 lock 做 npm 缓存键
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            client/src-tauri

      # ---------- 管理端（Vue 静态站点，服务端在 /admin/ 下托管）----------
      - name: Build admin (Vue)
        working-directory: admin
        run: |
          npm ci
          npm run build

      # ---------- 服务端（Rust 原生二进制）----------
      - name: Build server (Rust)
        working-directory: server
        run: cargo build --release

      # ---------- 客户端（Tauri 2 + Rust）----------
      # **每条 npm 命令各占一个 step，不要串在同一个 run: 里。**
      # 踩过的坑：Windows 腿的 run: 里串了 `npm ci` / `npm run build` / `npm run icon`，
      # 其中 `npm run build` 失败，但 pwsh 的 `$ErrorActionPreference='Stop'` 默认不拦原生命令的
      # 非零退出，GitHub 也只在脚本**末尾**查一次 `$LASTEXITCODE`——于是紧接着的命令把退出码
      # 盖成 0，步骤绿灯通过，最后打出一个缺渲染层的包（用户双击才炸）。拆开之后每步各自查退出码。
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build client renderer
        working-directory: client
        run: npm run build

      # Linux 上 Tauri 的编译期与运行期都依赖 webkit2gtk（AppImage 不会把它打进去）
      - name: Install Linux webkit deps
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xvfb

      - name: Package client (${{ matrix.target_os }}-${{ matrix.arch }})
        working-directory: client
        run: npx tauri build --target ${{ matrix.tauri_target }} ${{ matrix.bundle_flag }}

      # 打包门禁（替代 Electron 时代的 asar 校验 + CDP 冒烟）：
      # 真把打包产物跑一遍，断言"首屏已挂载 + 一次 IPC 往返成功"。
      # macOS 没有 WebDriver，所以走应用内 `--self-check` 注入，三平台同一套。
      - name: Self-check packaged app
        shell: bash
        # 防止"WebView 起不来但进程不退出"把 job 拖到 6 小时超时
        timeout-minutes: 5
        run: |
          set -euo pipefail
          BIN="client/src-tauri/target/${{ matrix.tauri_target }}/release/b-artifact-app"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          if [ ! -f "$BIN" ]; then echo "缺少打包产物：$BIN"; exit 1; fi
          export B_ARTIFACT_HOME="$(mktemp -d)"

          run_check() {
            if [ "${{ matrix.target_os }}" = "linux" ]; then
              # xvfb 里没有 GPU 合成器：不关掉 WebKitGTK 的 DMABUF 渲染会直接白屏
              WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 GDK_BACKEND=x11 \
                xvfb-run -a "$BIN" --self-check
            else
              "$BIN" --self-check
            fi
          }

          # 共享 runner 上 GUI 冒烟偶发超时很常见（首个 1 MB 的前端冷启动）。
          # 失败重试一次：仍然是真门禁，但不会因为一次抖动把整条腿判死。
          if run_check; then exit 0; fi
          echo "第 1 次自检失败，3s 后重试…"
          sleep 3
          run_check

      # ---------- 组装后端交付物：二进制 + admin/dist + 样例配置 ----------
      - name: Assemble backend bundle
        shell: bash
        run: |
          set -euo pipefail
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          BIN="b-artifact-server${{ matrix.ext }}"
          SRC="server/target/release/$BIN"
          # 目录名带上架构：Rust 二进制是**跟着 runner 架构原生编译**的（mac 腿现为 arm64），
          # 名字里不标架构的话，将来再加一条 x64 腿就会互相覆盖，用户也无从判断能不能跑。
          DEST="upload/b-artifact-server-$OS-$ARCH"
          mkdir -p "$DEST/admin"
          cp "$SRC" "$DEST/"
          cp -r admin/dist "$DEST/admin/dist"
          cat > "$DEST/b-artifact.toml.example" <<'TOML'
          # b-artifact 服务端配置示例
          # 用法：把本文件复制为 b-artifact.toml 后修改。放到 exe 同目录即可被自动发现，
          # 也可 b-artifact-server.exe --config <本文件路径> 显式指定。
          # 启动日志会打印「配置文件: ...」一行，用它确认到底读的是哪份配置。
          #
          # 注意（v0.4.24）：本文件里的每一项都必须与实际实现一致——服务端已开启
          # deny_unknown_fields，写错的配置项会**直接报错退出**，不再被静默忽略。

          [server]
          listen = "0.0.0.0:9000"
          # 管理端静态站；相对路径相对进程工作目录，注册成 Windows 服务时 CWD 往往是
          # C:\Windows\System32，服务化部署建议在此写绝对路径。
          admin_dir = "admin/dist"
          # data_dir = "D:/b-artifact/data"

          [storage]
          #合法值：off | auto | always（v0.4.24 修正：此前误写 "zstd"，是非法值）
          compression = "auto"
          max_file_size_mb = 2048
          chunk_threshold_mb = 64

          [auth]
          local_enabled = true              # false = 只走域账号，本地口令校验完全跳过
          session_ttl_days = 7
          # 连续失败 login_max_fails 次后锁定 login_lockout_secs 秒
          login_max_fails = 5
          login_lockout_secs = 60
          # 首个成功登录的用户自动成为系统管理员（本地 / LDAP 通用）
          first_user_admin = true

          [db]
          pool_size = 4

          # ---- 企业域账号统一登录（LDAP）----
          # 注意是 [auth.ldap]（嵌套在 [auth] 下），不是顶层 [ldap]。
          # 必填四项：url / bind_dn / bind_password / user_base。
          # 启用后请把 [auth] 的 local_enabled 按需调整。
          [auth.ldap]
          enabled = false
          url = "ldaps://ldap.example.com:636"
          # 明文 ldap:// 仅限内网调试，需显式打开，否则启动登录时报错拒绝
          allow_insecure = false
          bind_dn = "cn=svc-b-artifact,ou=service,dc=example,dc=com"
          bind_password = "改成真实密码"
          user_base = "ou=people,dc=example,dc=com"
          # 搜索过滤器。Active Directory 必须改成：
          #   user_filter = "(sAMAccountName={username})"
          # 不填则默认 (uid={username})。填错会导致搜不到用户，
          # 而登录页只显示"用户名或密码错误"，看不出是过滤器的问题。
          user_filter = "(uid={username})"
          attr_display_name = "cn"
          # Active Directory 必须改成 objectGUID（二进制值，服务端自动按 hex 存储）
          attr_unique_id = "entryUUID"
          TOML
          cat > "$DEST/README.txt" <<TXT
          b-artifact 服务端（backend）— ${{ matrix.target_os }} / ${{ matrix.arch }}

          启动（推荐：用本目录的配置文件，不带任何参数即可）
            b-artifact-server${{ matrix.ext }}

          启动（显式指定配置文件）
            b-artifact-server${{ matrix.ext }} --config "D:/path/to/b-artifact.toml"

          首次创建管理员（交互式输入密码）
            b-artifact-server${{ matrix.ext }} --create-admin admin

          配置文件：
            把 b-artifact.toml.example 复制为 b-artifact.toml 后修改，
            与 exe 放同一目录即可自动生效（也可 --config 显式指定）。
            启动日志会打印「配置文件: ...」，用它确认读的是哪份配置。
            ——注意：不存在时服务端**静默使用默认值**，所以配置没生效时先看这一行。

          数据目录默认 ./data（相对进程工作目录）；注册成 Windows 服务时建议在
          配置文件里写绝对路径 data_dir。

          管理端默认从本目录下的 admin/dist 提供（http://<host>:9000/admin/）。
          TOML
          echo "后端交付物已就绪：$DEST"

      - name: Stage client artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload/client
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          REL="client/src-tauri/target/${{ matrix.tauri_target }}/release"
          case "$OS" in
            macos)
              # ditto 保住 .app 的符号链接与权限；zip -r 会把 bundle 结构压坏
              ditto -c -k --sequesterRsrc --keepParent "$REL/bundle/macos/b-artifact.app" \
                "upload/client/b-artifact-$OS-$ARCH.zip"
              ;;
            windows)
              # 用户只要**单个 exe**（2026-09-24 定）：裸二进制即绿色版，前端资源已内嵌
              cp "$REL/b-artifact-app.exe" "upload/client/b-artifact-$OS-$ARCH.exe"
              ;;
            linux)
              tar -czf "upload/client/b-artifact-$OS-$ARCH.tar.gz" -C "$REL" b-artifact-app
              ;;
          esac
          # 产物体积兜底：**打包器不校验"应用能不能起来"，更不校验"有没有东西"**。
          # 曾经用 if-no-files-found: warn 让"缺渲染层"的包一路绿灯到用户双击。
          # 这里对一个必然 10 MB 级的二进制做下限断言，异常小就当场红。
          found=0
          for f in upload/client/*; do
            [ -f "$f" ] || continue
            found=1
            sz=$(wc -c < "$f")
            echo "  $(basename "$f") = $sz bytes"
            if [ "$sz" -lt 1000000 ]; then
              echo "客户端产物异常小（$sz bytes）：$f"; exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then echo "没有产出任何客户端交付物"; exit 1; fi
          echo "=== upload/ 内容 ==="
          ls -R upload

      # ---------- 后端打包成归档 ----------
      - name: Archive backend (unix)
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          tar -czf "upload/b-artifact-server-$OS-$ARCH.tar.gz" -C "upload/b-artifact-server-$OS-$ARCH" .
          rm -rf "upload/b-artifact-server-$OS-$ARCH"

      - name: Archive backend (windows)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $OS = "${{ matrix.target_os }}"
          $ARCH = "${{ matrix.arch }}"
          Compress-Archive -Path "upload/b-artifact-server-$OS-$ARCH/*" -DestinationPath "upload/b-artifact-server-$OS-$ARCH.zip" -Force
          Remove-Item -Recurse -Force "upload/b-artifact-server-$OS-$ARCH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target_os }}
          path: upload
          if-no-files-found: warn

  # 仅打 tag（v*）时把三个平台的产物汇总成一个 GitHub Release
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: dist-*
          merge-multiple: false

      - name: Flatten to release assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          echo "=== 待发布文件 ==="
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
